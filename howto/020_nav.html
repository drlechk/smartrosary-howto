<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400&amp;display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../styles.css" />
    <style>
      body {
        align-items: stretch;
        overflow-x: hidden;
        background:
          radial-gradient(circle at 42% 44%, rgba(0, 0, 0, 0.08), transparent 42%),
          #f5f6f4;
      }

      .howto-header {
        position: fixed;
        inset: 0 0 auto;
        z-index: 50;
        min-height: 60px;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 12px;
        padding: 10px clamp(18px, 4vw, 64px);
        border-bottom: 1px solid rgba(23, 34, 32, 0.12);
        background: rgba(245, 246, 244, 0.9);
        -webkit-backdrop-filter: blur(14px);
        backdrop-filter: blur(14px);
      }

      .howto-home-link {
        width: 40px;
        height: 40px;
        flex: 0 0 auto;
        display: grid;
        place-items: center;
        border-radius: 50%;
        box-shadow: 0 8px 20px rgba(9, 116, 204, 0.18);
      }

      .howto-home-link img {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: 50%;
      }

      .howto-selector-control {
        width: min(220px, calc(100vw - 190px));
        min-width: 0;
        flex: 0 1 auto;
      }

      .howto-language {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .howto-language span {
        color: #57615f;
        font-size: 12px;
        line-height: 1.2;
      }

      .howto-language select {
        width: 180px;
        height: 40px;
        padding: 0 36px 0 12px;
        border: 1px solid rgba(23, 34, 32, 0.2);
        border-radius: 8px;
        background: #fff;
        color: #172220;
        font: inherit;
        font-size: 14px;
        cursor: pointer;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      }

      .nav-stage {
        --device-size: min(50vw, 680px, calc(100svh - 116px));
        --case-padding: clamp(12px, calc(var(--device-size) * 0.033), 20px);
        --bezel-padding: clamp(18px, calc(var(--device-size) * 0.077), 48px);
        --howto-cross-scale: clamp(0.52, calc(var(--device-size) / 920), 0.68);
        --nav-device-arrow-size: 42px;
        --nav-device-arrow-gap: 4px;
        --nav-device-knob-overhang: calc(var(--device-size) * 0.035);
        --nav-card-width: 420px;
        --nav-card-height: 462px;
        --screen-size: calc(var(--device-size) - (var(--case-padding) * 2) - (var(--bezel-padding) * 2));
        min-height: 100svh;
        width: 100%;
        max-width: 100vw;
        padding: clamp(64px, 6svh, 88px) clamp(28px, 6vw, 112px) 32px;
        display: grid;
        grid-template-columns: minmax(320px, var(--device-size)) minmax(320px, 420px);
        grid-template-areas:
          "device card"
          "device panel";
        grid-template-rows: auto auto;
        align-content: center;
        justify-content: center;
        column-gap: clamp(50px, 7vw, 112px);
        row-gap: 24px;
      }

      .nav-device-wrap {
        position: relative;
        grid-area: device;
        display: grid;
        place-items: center;
        min-width: 0;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
      }

      .nav-device-frame {
        position: relative;
        width: var(--device-size);
        height: var(--device-size);
        max-width: 100%;
        aspect-ratio: 1;
        -webkit-user-select: none;
        user-select: none;
      }

      .nav-device-frame * {
        -webkit-user-select: none;
        user-select: none;
      }

      .nav-device-arrow {
        position: absolute;
        z-index: 20;
        width: var(--nav-device-arrow-size);
        height: var(--nav-device-arrow-size);
        display: grid;
        place-items: center;
        border: 1px solid rgba(23, 34, 32, 0.2);
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.94);
        color: #172220;
        padding: 0;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 0;
        font-weight: 400;
        line-height: 0;
        cursor: pointer;
        -webkit-appearance: none;
        appearance: none;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.12);
      }

      .nav-device-arrow::before {
        content: "";
        position: absolute;
        top: 50%;
        left: 50%;
        width: 10px;
        height: 10px;
        border-top: 2px solid currentColor;
        border-right: 2px solid currentColor;
        transform-origin: center;
      }

      .nav-device-arrow--up::before {
        transform: translate(-50%, -36%) rotate(-45deg);
      }

      .nav-device-arrow--right::before {
        transform: translate(-62%, -50%) rotate(45deg);
      }

      .nav-device-arrow--down::before {
        transform: translate(-50%, -64%) rotate(135deg);
      }

      .nav-device-arrow--left::before {
        transform: translate(-38%, -50%) rotate(-135deg);
      }

      .nav-device-arrow--up,
      .nav-device-arrow--down {
        left: 50%;
      }

      .nav-device-arrow--up {
        top: 0;
        transform: translate(
          -50%,
          calc(-100% - var(--nav-device-knob-overhang) - var(--nav-device-arrow-gap))
        );
      }

      .nav-device-arrow--down {
        bottom: 0;
        transform: translate(-50%, calc(100% + var(--nav-device-arrow-gap)));
      }

      .nav-device-arrow--left,
      .nav-device-arrow--right {
        top: 50%;
      }

      .nav-device-arrow--left {
        left: 0;
        transform: translate(calc(-100% - var(--nav-device-arrow-gap)), -50%);
      }

      .nav-device-arrow--right {
        right: 0;
        transform: translate(calc(100% + var(--nav-device-arrow-gap)), -50%);
      }

      .nav-device-arrow:disabled {
        opacity: 0.28;
        cursor: default;
      }

      .nav-stage .device {
        width: var(--device-size);
        height: var(--device-size);
        max-width: 100%;
        aspect-ratio: 1;
      }

      .nav-stage .cross {
        transform: translate(-50%, -50%) scale(var(--howto-cross-scale));
        transform-origin: center;
      }

      .nav-stage .screen-panel {
        visibility: visible;
        transition: none;
      }

      .nav-stage .nav-device--ready .screen-panel {
        transition: transform 260ms ease;
      }

      .nav-stage .screen__bg {
        transition: opacity 150ms ease;
      }

      .nav-stage .screen {
        cursor: grab;
        touch-action: none;
        user-select: none;
      }

      .nav-stage .screen:active {
        cursor: grabbing;
      }

      .gesture-intro {
        position: absolute;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        overflow: hidden;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.78);
        color: #fff;
        opacity: 1;
        visibility: visible;
        pointer-events: none;
        transition:
          opacity 220ms ease,
          visibility 0s linear 220ms;
      }

      .gesture-intro--hidden {
        opacity: 0;
        visibility: hidden;
      }

      .gesture-intro__axis {
        position: absolute;
        display: grid;
        place-items: center;
        color: #55e4ff;
        font-size: calc(var(--screen-size) * 44 / 240);
        line-height: 1;
        text-shadow: 0 0 14px rgba(85, 228, 255, 0.74);
      }

      .gesture-intro__axis--horizontal {
        animation: gesture-horizontal 2600ms ease-in-out infinite;
      }

      .gesture-intro__axis--vertical {
        animation: gesture-vertical 2600ms ease-in-out infinite;
      }

      .gesture-intro__text {
        position: absolute;
        bottom: 20%;
        width: 72%;
        text-align: center;
        color: rgba(255, 255, 255, 0.9);
        font-size: calc(var(--screen-size) * 11 / 240);
        line-height: 1.35;
      }

      @keyframes gesture-horizontal {
        0%,
        45% {
          opacity: 1;
          transform: translateX(-24%);
        }
        22% {
          transform: translateX(24%);
        }
        50%,
        100% {
          opacity: 0;
          transform: translateX(0);
        }
      }

      @keyframes gesture-vertical {
        0%,
        50% {
          opacity: 0;
          transform: translateY(0);
        }
        55%,
        100% {
          opacity: 1;
          transform: translateY(-24%);
        }
        77% {
          transform: translateY(24%);
        }
      }

      .nav-card {
        grid-area: panel;
        width: min(100%, var(--nav-card-width));
        min-width: 0;
        height: var(--nav-card-height);
        box-sizing: border-box;
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr);
        align-content: start;
        padding: 16px;
        border: 1px solid rgba(23, 34, 32, 0.16);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.94);
        color: #172220;
        box-shadow: 0 18px 42px rgba(0, 0, 0, 0.14);
      }

      .nav-card h1 {
        margin: 0 0 8px;
        color: #0e1817;
        font-size: 22px;
        font-weight: 400;
        line-height: 1.12;
      }

      .nav-description > p:first-child {
        margin: 0;
        color: #26302f;
        font-size: 14px;
        line-height: 1.45;
      }

      .nav-description {
        padding-top: 8px;
        padding-bottom: 18px;
      }

      .nav-optional {
        margin: 8px 0 0;
        color: #586361;
        font-size: 12px;
        line-height: 1.35;
      }

      .nav-optional[hidden] {
        display: none;
      }

      .nav-map {
        position: relative;
        display: grid;
        grid-template-columns: repeat(5, 29px);
        grid-template-rows: repeat(9, 23px);
        width: max-content;
        gap: 0;
        justify-self: center;
        align-self: end;
        margin-top: 12px;
        transform: scale(1.25);
        transform-origin: center bottom;
      }

      .nav-map__lines {
        position: absolute;
        inset: 0;
        z-index: 0;
        width: 100%;
        height: 100%;
        overflow: visible;
        pointer-events: none;
      }

      .nav-map__lines line {
        stroke: rgba(23, 34, 32, 0.22);
        stroke-width: 2;
      }

      .nav-map__item {
        position: relative;
        z-index: 1;
        min-width: 0;
        display: grid;
        place-items: center;
        padding: 0;
        border: 0;
        background: transparent;
        color: #65706e;
        font: inherit;
        font-size: 11px;
        line-height: 1.15;
        cursor: pointer;
      }

      .nav-map__dot {
        position: relative;
        z-index: 2;
        width: 17px;
        height: 17px;
        border: 2px solid #aab1af;
        border-radius: 50%;
        background: #fff;
      }

      .nav-map__label {
        display: none;
      }

      .nav-map__item[aria-current="page"] {
        color: #0e1817;
      }

      .nav-map__item[aria-current="page"] .nav-map__dot {
        border-color: #2196f3;
        background: #2196f3;
        box-shadow: 0 0 0 4px rgba(33, 150, 243, 0.16);
      }

      .nav-map__item[data-optional="true"]:not([aria-current="page"]) .nav-map__dot {
        border-color: transparent;
      }

      .nav-map__item[data-optional="true"]:not([aria-current="page"]) .nav-map__dot::after {
        content: "";
        position: absolute;
        inset: -2px;
        border-radius: 50%;
        background: repeating-conic-gradient(
          from 2deg,
          rgba(170, 177, 175, 0.62) 0deg 7deg,
          transparent 7deg 12deg
        );
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 0);
        mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 0);
        pointer-events: none;
      }

      .nav-map__item[data-action="true"] .nav-map__dot {
        border-color: #8b9693;
        width: 28px;
        height: 16px;
        border-radius: 5px;
        background: #f5f6f4;
      }

      .nav-map__item[data-action="true"][aria-current="page"] .nav-map__dot {
        border-color: #03a9f4;
        background: #03a9f4;
      }

      .nav-panel {
        grid-area: card;
        display: grid;
        align-content: start;
        gap: 18px;
        min-width: 0;
        color: #172220;
      }

      .nav-panel h2 {
        margin: 0;
        font-size: clamp(30px, 5vw, 52px);
        font-weight: 400;
        line-height: 1;
      }

      .nav-panel p {
        margin: 0;
        max-width: 40ch;
        color: #3d4745;
        font-size: 15px;
        line-height: 1.5;
      }

      @media (min-width: 921px) and (max-width: 1180px) and (max-height: 850px) {
        .nav-stage {
          --device-size: min(38vw, 390px, calc(100svh - 180px));
          --nav-device-arrow-size: 38px;
          padding: clamp(58px, 7svh, 72px) clamp(18px, 3vw, 36px) 24px;
          grid-template-columns:
            minmax(0, calc(var(--device-size) + ((var(--nav-device-arrow-size) + var(--nav-device-arrow-gap)) * 2)))
            minmax(320px, 400px);
          column-gap: clamp(32px, 4vw, 52px);
        }
      }

      @media (max-width: 920px) {
        .nav-stage {
          --device-size: min(78vw, clamp(240px, 40svh, 420px));
          --nav-card-height: 446px;
          padding: clamp(62px, 7svh, 90px) clamp(18px, 5vw, 42px) 28px;
          grid-template-columns: minmax(0, 1fr);
          grid-template-areas:
            "card"
            "device"
            "panel";
          grid-template-rows: auto auto auto;
          justify-items: center;
          align-content: center;
          gap: clamp(24px, 4svh, 36px);
        }

        .nav-device-arrow {
          display: none;
        }

        .nav-panel {
          width: min(520px, 100%);
          min-width: 0;
          margin-bottom: clamp(8px, 1.6svh, 18px);
        }

        .nav-panel {
          justify-items: center;
          text-align: center;
        }
      }

      @media (max-width: 620px) {
        .howto-header {
          min-height: 48px;
          gap: 10px;
          padding-block: 6px;
          padding-inline: 14px;
        }

        .howto-home-link {
          width: 34px;
          height: 34px;
        }

        .howto-selector-control {
          width: min(170px, calc(100vw - 167px));
        }

        .howto-language {
          width: auto;
          flex: 0 0 auto;
          justify-content: flex-end;
        }

        .howto-language select {
          width: min(180px, 65vw);
        }

        .nav-stage {
          --device-size: min(76vw, clamp(168px, 34svh, 330px));
          --nav-card-height: clamp(198px, 35svh, 260px);
          padding: clamp(50px, 6svh, 68px) 14px 10px;
          gap: clamp(8px, 1.5svh, 14px);
        }

        .nav-panel {
          gap: 8px;
          margin-bottom: clamp(6px, 1.4svh, 12px);
        }

        .nav-panel p {
          font-size: 12px;
          line-height: 1.32;
        }

        .nav-card h1 {
          margin-bottom: 5px;
          font-size: clamp(16px, 4.8vw, 19px);
        }

        .nav-card {
          padding: 10px 12px;
        }

        .nav-description {
          padding-top: 4px;
          padding-bottom: 8px;
        }

        .nav-description > p:first-child {
          font-size: 12px;
          line-height: 1.3;
        }

        .nav-optional {
          margin-top: 4px;
          font-size: 10px;
          line-height: 1.2;
        }

        .nav-map {
          grid-template-columns: repeat(5, 24px);
          grid-template-rows: repeat(9, 18px);
          margin-top: 4px;
          transform: scale(0.92);
        }

        .nav-map__item {
          font-size: 10px;
        }

        .nav-map__dot {
          width: 14px;
          height: 14px;
        }

        .nav-map__item[data-action="true"] .nav-map__dot {
          width: 22px;
          height: 13px;
        }

        .nav-panel h2 {
          font-size: clamp(21px, 7.2vw, 29px);
        }

      }

      @media (max-width: 340px), (max-height: 700px) and (orientation: portrait) {
        .nav-stage {
          --device-size: min(64vw, clamp(140px, 27svh, 240px));
          --nav-card-height: 204px;
          padding-top: 54px;
        }

        .nav-card h1 {
          font-size: 15px;
        }

        .nav-description > p:first-child,
        .nav-panel p {
          font-size: 11px;
          line-height: 1.22;
        }

        .nav-panel h2 {
          font-size: clamp(19px, 6.5vw, 25px);
        }

        .nav-map {
          grid-template-columns: repeat(5, 21px);
          grid-template-rows: repeat(9, 15px);
          transform: scale(0.7);
        }

        .nav-map__dot {
          width: 12px;
          height: 12px;
          border-width: 1.5px;
        }

        .nav-map__item[data-action="true"] .nav-map__dot {
          width: 18px;
          height: 11px;
        }
      }
    </style>
  </head>
  <body>
    <header class="howto-header">
      <a class="howto-home-link" href="https://drlechk.github.io/smartrosary/" aria-label="SmartRosary website">
        <img src="../smartrosary-logo.svg" alt="SmartRosary" />
      </a>
      <select id="howto-selector" class="howto-selector-control" style="height: 40px; padding: 0 12px; border: 1px solid rgba(23, 34, 32, 0.2); border-radius: 8px; background: #fff; color: #172220; font: inherit; font-size: 14px; cursor: pointer; margin-right: auto; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);">
        <option value="010_onoff.html"></option>
        <option value="011_charging.html"></option>
        <option value="020_nav.html"></option>
      </select>
      <label class="howto-language" for="howto-language-control">
        <span id="howto-language-label" style="display: none;"></span>
        <select id="howto-language-control" style="width: 72px;">
          <option value="pl">PL</option>
          <option value="de">DE</option>
          <option value="en">EN</option>
          <option value="es">ES</option>
          <option value="fr">FR</option>
          <option value="pt">PT</option>
        </select>
      </label>
    </header>

    <main class="nav-stage" data-step="0" style="--wallpaper-opacity: 0.4">
      <div class="nav-device-wrap">
        <div class="nav-device-frame">
          <button class="nav-device-arrow nav-device-arrow--up" id="nav-device-up" type="button">↑</button>
          <button class="nav-device-arrow nav-device-arrow--left" id="nav-device-left" type="button">←</button>
          <section class="device device--rosary" id="nav-device" aria-label="">
            <div class="device__knob" aria-hidden="true"></div>
            <div class="device__bezel">
              <div class="screen">
              <div class="screen__art" aria-hidden="true">
                <div class="screen__bg" style="background-image: url('../bg/pmkdus.png'); opacity: 0.6"></div>
                <div class="screen__shade"></div>
              </div>

              <div class="screen-panel mystery-view mystery" data-screen="mystery" aria-hidden="true">
                <div class="mystery__content">
                  <h1 class="mystery__title" id="nav-mystery-title"></h1>
                  <div class="mystery__roller" role="list">
                    <div class="mystery__row" role="listitem"><span>V</span></div>
                    <div class="mystery__row mystery__row--selected" role="listitem"><span>-</span></div>
                    <div class="mystery__row" role="listitem"><span>I</span></div>
                  </div>
                </div>
              </div>

              <div class="screen-panel mysteries-view mysteries" data-screen="mysteries" aria-hidden="true">
                <h1 class="mysteries__title" id="nav-mysteries-title"></h1>
                <div class="mysteries__menu" role="list">
                  <div class="mysteries__row mysteries__row--empty" role="listitem">-</div>
                  <div class="mysteries__row mysteries__row--selected" role="listitem">radosne (pon./so.)</div>
                  <div class="mysteries__row" role="listitem">światła (czw.)</div>
                </div>
              </div>

              <div class="screen-panel stats-view stats" data-screen="stats-history" aria-hidden="true">
                <h1 class="stats__title" id="nav-stats-history-title">History</h1>
                <div class="stats__history-selector" id="nav-stats-history-selector">week</div>
                <div class="stats__history-label" id="nav-stats-history-label">29.6.26 - 5.7.26</div>
                <div class="stats__history" id="nav-stats-history-chart" aria-label="History chart"></div>
                <div class="stats__legend stats__legend--history" id="nav-stats-history-legend"></div>
              </div>

              <div class="screen-panel stats-view stats" data-screen="stats-durations" aria-hidden="true">
                <h1 class="stats__title" id="nav-stats-durations-title"></h1>
                <div class="stats__subtitle" id="nav-stats-durations-subtitle"></div>
                <div class="stats__pairs" aria-label="">
                  <div class="stats__pair"><span id="nav-stats-avg-bead"></span><strong>6s</strong></div>
                  <div class="stats__pair"><span id="nav-stats-avg-decade"></span><strong>5m 42s</strong></div>
                  <div class="stats__pair"><span id="nav-stats-avg-rosary"></span><strong>31m 10s</strong></div>
                  <div class="stats__pair"><span id="nav-stats-avg-chaplet"></span><strong>18m 25s</strong></div>
                </div>
              </div>

              <div class="screen-panel stats-view stats" data-screen="stats-totals" aria-hidden="true">
                <h1 class="stats__title" id="nav-stats-totals-title"></h1>
                <div class="stats__subtitle" id="nav-stats-totals-subtitle"></div>
                <div class="stats__pairs stats__pairs--totals" aria-label="">
                  <div class="stats__pair"><span id="nav-stats-total-rosary"></span><strong>37h 24m</strong></div>
                  <div class="stats__pair"><span id="nav-stats-total-decades"></span><strong>82h 10m</strong></div>
                  <div class="stats__pair"><span id="nav-stats-total-beads"></span><strong>7h 42m</strong></div>
                  <div class="stats__pair"><span id="nav-stats-total-chaplet"></span><strong>4h 05m</strong></div>
                </div>
              </div>

              <div class="screen-panel stats-view stats" data-screen="stats-sets" aria-hidden="true">
                <h1 class="stats__title" id="nav-stats-sets-title"></h1>
                <div class="stats__subtitle" id="nav-stats-sets-subtitle"></div>
                <div class="stats__donut" aria-hidden="true"></div>

        function buildBeads() {
          const beads = document.getElementById("nav-beads");
          const totalBeads = 59;
          const loopStart = 4;
          const beadsPerDecade = 10;
          const screenBase = 240;
          const radius = 110;
          const cx = 120;
          const cy = 120;
          const angleStep = 360 / (totalBeads - loopStart);
          const tailPositions = [[cx, 182], [cx, 194], [cx, 206], [cx, 218]];
          const toPercent = (value) => `${(value / screenBase) * 100}%`;

          for (let index = 0; index < totalBeads; index += 1) {
            const bead = document.createElement("span");
            const isTail = index < loopStart;
            const isRed = index === 0 || (!isTail && (index - loopStart) % (beadsPerDecade + 1) === 0);
            const size = isRed ? 10 : 8;
            let x;
            let y;

            bead.className = `bead bead--${isRed ? "red" : "blue"}`;
            if (isTail) {
              [x, y] = tailPositions[index];
            } else {
              const angle = (90 + (index - loopStart) * angleStep) * (Math.PI / 180);
              x = cx + Math.trunc(radius * Math.cos(angle));
              y = cy + Math.trunc(radius * Math.sin(angle));
            }
            bead.style.left = toPercent(x - size / 2);
            bead.style.top = toPercent(y - size / 2);
            bead.style.width = toPercent(size);
            bead.style.height = toPercent(size);
            beads.appendChild(bead);
          }
        }

          document.getElementById("nav-time").textContent = new Date().toLocaleTimeString("en-GB", { hour12: false });

        function renderSettingsQr() {
          const qr = document.getElementById("nav-settings7-qr");
          const ns = "http://www.w3.org/2000/svg";
          const group = document.createElementNS(ns, "g");
          const rows = "1fdd3d7f,105ccb41,17565a5d,175aa45d,17407c5d,10531641,1fd5557f,00097d00,19c2ca2f,0f2d7c7f,11c3e4c1,1a869c0b,0d559d82,1508fc7f,06dc24ad,0ead4dd3,1e4eea82,1025307b,03ebf1b5,013a9c23,1a5d99f9,0018ff11,1fc43f5d,10556f12,175adbfa,17493421,1743fa8f,105a9d2b,1fd5997a"
            .split(",")
            .map((row) => Number.parseInt(row, 16));

          group.setAttribute("fill", "#000");
          group.setAttribute("transform", "translate(4 4)");
          rows.forEach((row, y) => {
            for (let x = 0; x < 29; x += 1) {
              if ((row & (1 << (28 - x))) === 0) continue;
              const module = document.createElementNS(ns, "rect");
              module.setAttribute("x", String(x));
              module.setAttribute("y", String(y));
              module.setAttribute("width", "1");
              module.setAttribute("height", "1");
              group.appendChild(module);
            }
          });
          qr.appendChild(group);
        }

        function getStatsSetLabels() {

        function createLegendItem(label, color, value) {
          const item = document.createElement("span");
          item.className = "stats-legend-item";
          
          const swatch = document.createElement("i");
          swatch.className = "stats-color";
          swatch.style.backgroundColor = color;
          swatch.style.boxShadow = `0 0 6px ${color}`;
          
          const whole = Math.floor(value / 5);
          const remainder = value % 5;
          
          const text = document.createTextNode(`${label} ${whole}`);
          item.append(swatch, text);
          
          if (remainder > 0) {
            const dots = document.createElement("div");
            dots.style.display = "inline-flex";
            dots.style.flexDirection = "column-reverse";
            dots.style.marginLeft = "4px";
            dots.style.gap = "1px";
            for (let i = 0; i < remainder; i++) {
              const dot = document.createElement("div");
              dot.style.width = "calc(var(--screen-size) * 2 / 240)";
              dot.style.height = "calc(var(--screen-size) * 2 / 240)";
              dot.style.backgroundColor = "#ffffff";
              dots.appendChild(dot);
            }
            item.appendChild(dots);
          }
          
          return item;
        }

        function renderStatsPanels() {
          const statsTitle = getLangText("l037", "Statistics");
          const statsSetLabels = getStatsSetLabels();
          const withColon = (text) => `${text} :`;

          function formatDuration(ms) {
            if (!ms) return "0s";
            const totalSec = Math.floor(ms / 1000);
            if (totalSec < 60) return `${totalSec}s`;
            const min = Math.floor(totalSec / 60);
            const s = totalSec % 60;
            return s > 0 ? `${min}m ${s}s` : `${min}m`;
          }

          function formatTotal(ms) {
            if (!ms) return "0h 00m";
            const totalMin = Math.floor(ms / 60000);
            const hours = Math.floor(totalMin / 60);
            const mins = totalMin % 60;
            return `${hours}h ${mins.toString().padStart(2, '0')}m`;
          }

          const dur = mockStats.stats.durations || {};

          // Set translated title for History panel
          document.getElementById("nav-stats-history-title").textContent = getLangText("l044", "History");

          ["durations", "totals", "sets", "parts"].forEach((name) => {
            document.getElementById(`nav-stats-${name}-title`).textContent = statsTitle;
          });
          document.getElementById("nav-stats-history-selector").textContent = getLangText("l046", "Week");
          document.getElementById("nav-stats-durations-subtitle").textContent = getLangText("l023", "Duration & averages");
          document.getElementById("nav-stats-totals-subtitle").textContent = getLangText("l028", "Totals (time)");

          document.getElementById("nav-stats-parts-subtitle").textContent = getLangText("l035", "Parts I-V per set");
          document.getElementById("nav-stats-avg-bead").textContent = withColon(getLangText("l024", "Avg bead"));
          document.getElementById("nav-stats-avg-bead").nextElementSibling.textContent = formatDuration(dur.avgBeadMs);
          document.getElementById("nav-stats-avg-decade").textContent = withColon(getLangText("l025", "Avg decade"));
          document.getElementById("nav-stats-avg-decade").nextElementSibling.textContent = formatDuration(dur.avgDecadeMs);
          document.getElementById("nav-stats-avg-rosary").textContent = withColon(getLangText("l026", "Avg rosary"));
          document.getElementById("nav-stats-avg-rosary").nextElementSibling.textContent = formatDuration(dur.avgRosaryMs);
          document.getElementById("nav-stats-avg-chaplet").textContent = withColon(getLangText("l027", "Avg chaplet"));
          document.getElementById("nav-stats-avg-chaplet").nextElementSibling.textContent = formatDuration(dur.avgChapletMs);
          document.getElementById("nav-stats-total-rosary").textContent = withColon(getLangText("l029", "Rosary"));
          document.getElementById("nav-stats-total-rosary").nextElementSibling.textContent = formatTotal(Number(dur.totalRosaryMs));
          document.getElementById("nav-stats-total-decades").textContent = withColon(getLangText("l030", "Decades"));
          document.getElementById("nav-stats-total-decades").nextElementSibling.textContent = formatTotal(Number(dur.totalDecadeMs));
          document.getElementById("nav-stats-total-beads").textContent = withColon(getLangText("l031", "Beads"));
          document.getElementById("nav-stats-total-beads").nextElementSibling.textContent = formatTotal(Number(dur.totalBeadMs));
          document.getElementById("nav-stats-total-chaplet").textContent = withColon(getLangText("l032", "Chaplet"));
          document.getElementById("nav-stats-total-chaplet").nextElementSibling.textContent = formatTotal(Number(dur.totalChapletMs));

          const setRows = [[0, 1, 2], [3, 4], [5]];
          
          // Render pie chart for Sets
          const donut = document.querySelector(".stats__donut");
          if (donut) {
            const totalSetCount = statsSetValues.reduce((a, b) => a + b, 0);
            if (totalSetCount > 0) {
              let currentDeg = 0;
              const conicStops = statsSetValues.map((value, index) => {
                if (value === 0) return null;
                const deg = (value / totalSetCount) * 360;
                const stop = `${statsSetColors[index]} ${currentDeg}deg ${currentDeg + deg}deg`;
                currentDeg += deg;
                return stop;
              }).filter(Boolean);
              donut.style.background = `conic-gradient(from 90deg, ${conicStops.join(", ")})`;
            } else {
              donut.style.background = `conic-gradient(from 90deg, #808080 0deg 360deg)`;
            }
          }
          
          const legend = document.getElementById("nav-stats-set-legend");
          legend.replaceChildren();
          setRows.forEach((rowIndices) => {
            const rowDiv = document.createElement("div");
            rowDiv.className = "stats__legend-row";
            rowIndices.forEach((index) => {
              const label = statsSetLabels[index];
              rowDiv.appendChild(createLegendItem(label, statsSetColors[index], statsSetValues[index]));
            });
            legend.appendChild(rowDiv);
          });
          
          // Parse base64 history
          const historyChart = document.getElementById("nav-stats-history-chart");
          historyChart.replaceChildren();
          
          let dayData = Array.from({ length: 7 }, () => ({ total: 0, segments: [] }));
          let startTs = 0;
          let endTs = 0;
          let historyLegendValues = [0, 0, 0, 0, 0, 0];
          if (window.MOCKUP_HISTORY_B64) {
            const binaryString = atob(window.MOCKUP_HISTORY_B64);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) {
              bytes[i] = binaryString.charCodeAt(i);
            }
            const view = new DataView(bytes.buffer);
            const recordSize = 5;
            const recordCount = Math.floor(bytes.buffer.byteLength / recordSize);
            
            // Force anchor date to July 1, 2026 to show the week 29.6.26 - 5.7.26
            let maxTs = 1782907200;
            
            const anchorDate = new Date(maxTs * 1000);
            const currentDay = anchorDate.getDay();
            const daysToMonday = currentDay === 0 ? 6 : currentDay - 1;
            anchorDate.setDate(anchorDate.getDate() - daysToMonday);
            anchorDate.setHours(0, 0, 0, 0);
            
            startTs = anchorDate.getTime() / 1000;
            const endDate = new Date(anchorDate);
            endDate.setDate(endDate.getDate() + 7);
            endTs = endDate.getTime() / 1000;
            
            const formatDate = (d) => `${d.getDate()}.${d.getMonth() + 1}.${String(d.getFullYear()).slice(-2)}`;
            const endDateFormatted = new Date(endDate);
            endDateFormatted.setDate(endDateFormatted.getDate() - 1);
            document.getElementById("nav-stats-history-label").textContent = `${formatDate(anchorDate)} - ${formatDate(endDateFormatted)}`;
            
            for (let i = 0; i < recordCount; i++) {
              const ts = view.getUint32(i * recordSize, true);
              const b0 = view.getUint8(i * recordSize + 4);
              if (ts < startTs || ts >= endTs) continue;
              
              const intention = (b0 & 1) === 1;
              const noDateTime = ((b0 >> 1) & 1) === 1;
              if (noDateTime) continue;
              
              const dec = (b0 >> 2) & 7;
              const pk = (b0 >> 5) & 7;
              
              const idx = Math.floor((ts - startTs) / 86400);
              if (idx >= 0 && idx < 7) {
                let segmentSet = 0, segmentPart = 0, weight = 1;
                if (dec === 0) { segmentSet = 5; segmentPart = 0; weight = 5; }
                else if (dec > 0 && dec <= 5) { segmentSet = pk; segmentPart = dec - 1; weight = 1; }
                else continue;
                
                dayData[idx].total += weight;
                let existingSeg = dayData[idx].segments.find(s => s.set === segmentSet && s.part === segmentPart && s.intention === intention);
                if (existingSeg) existingSeg.count += weight;
                else dayData[idx].segments.push({ count: weight, set: segmentSet, part: segmentPart, intention });
              }
            }
          }
          
          const maxHistory = Math.max(...dayData.map(d => d.total), 0);
          
          if (maxHistory > 0) {
            dayData.forEach((day) => {
              const bar = document.createElement("div");
              bar.className = "stats__history-bar";
              if (day.total > 0) {
                bar.style.height = `${(day.total / maxHistory) * 100}%`;
                
                const sortedSegments = [...day.segments].sort((a, b) => {
                  const getRank = (s) => {
                    const segIndex = (s.set === 5) ? 25 : (s.set * 5 + s.part);
                    if (!s.intention) return segIndex === 25 ? 0 : 100 - segIndex;
                    return segIndex === 25 ? 200 : 300 - segIndex;
                  };
                  return getRank(a) - getRank(b);
                });
                
                sortedSegments.forEach(seg => {
                  historyLegendValues[seg.set] += seg.count;
                  const segment = document.createElement("div");
                  segment.className = "stats__history-segment";
                  if (seg.intention) segment.classList.add("stats__history-segment--intention");
                  segment.style.setProperty("--h", `${(seg.count / day.total) * 100}%`);
                  if (seg.set === 5) {
                    segment.style.setProperty("--c", statsSetColors[5]);
                  } else {
                    segment.style.setProperty("--c", statsPartColors[seg.set][seg.part]);
                  }
                  bar.appendChild(segment);
                });
              }
              historyChart.appendChild(bar);
            });
          }
          
          const historyLegend = document.getElementById("nav-stats-history-legend");
          historyLegend.replaceChildren();
          setRows.forEach((rowIndices) => {
            const rowDiv = document.createElement("div");
            rowDiv.className = "stats__legend-row";
            rowIndices.forEach((index) => {
              const label = statsSetLabels[index];
              rowDiv.appendChild(createLegendItem(label, statsSetColors[index], historyLegendValues[index]));
            });
            historyLegend.appendChild(rowDiv);
          });

          const rowTotals = statsPartValues.map((values) => values.reduce((sum, value) => sum + value, 0));
          const maxTotal = Math.max(...rowTotals);
          const bars = document.getElementById("nav-stats-parts-bars");
          bars.replaceChildren();
          statsPartValues.forEach((values, setIndex) => {
            const row = document.createElement("div");
            const label = document.createElement("span");
            const bar = document.createElement("div");
            const total = document.createElement("strong");

            row.className = "stats-bar";
            label.textContent = statsSetLabels[setIndex];
            values.forEach((value, partIndex) => {
              const segment = document.createElement("i");

              segment.style.setProperty("--w", `${maxTotal > 0 ? (value / maxTotal) * 100 : 0}%`);
              segment.style.setProperty("--c", statsPartColors[setIndex][partIndex]);
              bar.appendChild(segment);
            });
            total.textContent = String(rowTotals[setIndex]);
            row.append(label, bar, total);
            bars.appendChild(row);
          });

          const partKey = document.getElementById("nav-stats-part-key");
          partKey.replaceChildren();
          ["I", "II", "III", "IV", "V"].forEach((label, index) => {
            const item = document.createElement("span");
            const swatch = document.createElement("i");

            swatch.style.backgroundColor = statsPartColors[0][index];
            swatch.style.boxShadow = `0 0 6px ${statsPartColors[0][index]}`;
            item.append(swatch, document.createTextNode(label));
            partKey.appendChild(item);
          });
        }

        function renderMysteriesRoller() {
          const entries = getMysteriesEntries();
          const visibleIndexes = [0, 1, 2];
          const rows = Array.from(document.querySelectorAll(".mysteries__menu .mysteries__row"));

          rows.forEach((row, rowIndex) => {
            const text = entries[visibleIndexes[rowIndex]] ?? "";

            row.textContent = text;
            row.classList.toggle("mysteries__row--selected", rowIndex === 1);
            row.classList.toggle("mysteries__row--empty", text === "-");
          });
        }

        function getSettingsPageBody(page) {
          const descriptions = {
            1: `${getLangText("l006", "Start with selected Mystery")} / ${getLangText("l007", "Start with last state")}`,
            2: getLangText("l009", "Haptic feedback (vibration)"),
            3: getLangText("l010", "Screen brightness"),
            4: getLangText("l011", "Wallpaper brightness"),
            5: getLangText("l012", "Screen orientation"),
            6: getLangText("l021", "Auto shutdown after inactivity"),
            7: tutorial.deviceInfo.body,
          };

          return descriptions[page];
        }

        function getSettingsMapTitle(page) {
          return page === 7 ? tutorial.deviceInfo.short : getSettingsPageBody(page);
        }

        function getPointCopy(key) {
          const pointKeyByScreen = {
            "intentions-list": "intentionsList",
            "stats-history": "statsHistory",
            "stats-durations": "statsDurations",
            "stats-totals": "statsTotals",
            "stats-sets": "statsSets",
            "stats-parts": "statsParts",
          };
          const pointKey = pointKeyByScreen[key] ?? key;
          const point = tutorial.points?.[pointKey];

          return point ? { short: point.short, title: point.title, body: point.body } : null;
        }

        function getCopyForKey(key) {
          const pointCopy = getPointCopy(key);

          if (pointCopy) return pointCopy;
          if (key === "wallpaper") return tutorial.wallpaper;
          if (key.startsWith("stats-")) {
            const statsCopy = {
              "stats-history": {
                short: getLangText("l044", "History"),
                title: getLangText("l044", "History"),
                body: getLangText("l037", "Statistics"),
              },
              "stats-durations": {
                short: getLangText("l023", "Duration & averages"),
                title: getLangText("l023", "Duration & averages"),
                body: `${getLangText("l024", "Avg bead")}, ${getLangText("l025", "Avg decade")}, ${getLangText("l026", "Avg rosary")}`,
              },
              "stats-totals": {
                short: getLangText("l028", "Totals (time)"),
                title: getLangText("l028", "Totals (time)"),
                body: `${getLangText("l029", "Rosary")}, ${getLangText("l030", "Decades")}, ${getLangText("l031", "Beads")}`,
              },
              "stats-sets": {
                short: getLangText("l033", "Mystery sets"),
                title: getLangText("l033", "Mystery sets"),
                body: getLangText("l037", "Statistics"),
              },
              "stats-parts": {
                short: getLangText("l035", "Parts I-V per set"),
                title: getLangText("l035", "Parts I-V per set"),
                body: getLangText("l037", "Statistics"),
              },
            };

            return statsCopy[key];
          }
          if (key.startsWith("settings")) {
            const page = Number(key.replace("settings", ""));

            if (page === 7) return tutorial.deviceInfo;

            return {
              short: `${tutorial.settings.short} ${page}`,
              title: `${tutorial.settings.short} ${page}/7`,
              body: getSettingsPageBody(page),
            };
          }

          return steps[horizontalViews.indexOf(key)];
        }

        function getMapItems() {
          return [
            { key: "wallpaper", column: 3, row: 1, action: true },
            { key: "mystery", column: 1, row: 2 },
            { key: "mysteries", column: 2, row: 2 },
            { key: "rosary", column: 3, row: 2 },
            { key: "intentions", column: 4, row: 2, optional: true },
            { key: "intentions-list", column: 5, row: 2, optional: true },
            { key: "stats-history", column: 2, row: 3 },
            { key: "stats-durations", column: 2, row: 4 },
            { key: "stats-totals", column: 2, row: 5 },
            { key: "stats-sets", column: 2, row: 6 },
            { key: "stats-parts", column: 2, row: 7 },
            { key: "settings1", column: 3, row: 3 },
            { key: "settings2", column: 3, row: 4 },
            { key: "settings3", column: 3, row: 5 },
            { key: "settings4", column: 3, row: 6 },
            { key: "settings5", column: 3, row: 7 },
            { key: "settings6", column: 3, row: 8 },
            { key: "settings7", column: 3, row: 9 },
          ];
        }

        function renderMap() {
          navMap.querySelectorAll(".nav-map__item").forEach((item) => item.remove());
          getMapItems().forEach((item) => {
            const copy = getCopyForKey(item.key);
            const button = document.createElement("button");
            const dot = document.createElement("span");

            button.className = "nav-map__item";
            button.type = "button";
            button.style.gridColumn = String(item.column);
            button.style.gridRow = String(item.row);
            button.dataset.optional = String(Boolean(item.optional));
            button.dataset.action = String(Boolean(item.action));
            button.dataset.settings = String(item.key.startsWith("settings"));
            button.setAttribute("aria-label", copy.title);
            if (item.key === activeMapKey) button.setAttribute("aria-current", "page");
            button.addEventListener("click", () => activateMapItem(item.key));
            dot.className = "nav-map__dot";
            button.append(dot);
            navMap.appendChild(button);
          });
        }

        function renderDescription(key) {
          const copy = getCopyForKey(key);

          stepTitle.textContent = copy.title;
          stepBody.textContent = copy.body;
          optionalNote.textContent = tutorial.optionalNote;
          optionalNote.hidden = key !== "intentions" && key !== "intentions-list";
          renderMap();
        }

        function applyCopy() {
          document.documentElement.lang = language;
          document.title = tutorial.documentTitle;
          if (languageLabel) languageLabel.textContent = common.language;
          languageSelect.value = language;
          panel.setAttribute("aria-label", common.navigationLabel);
          panelTitle.textContent = tutorial.panelTitle;
          panelBody.textContent = tutorial.panelBody;
          const dict = window.SmartRosaryHowtoI18n.dictionaries[language] || window.SmartRosaryHowtoI18n.dictionaries["en"];
          if (dict && dict.tutorials && typeof howtoSelector !== 'undefined' && howtoSelector) {
            howtoSelector.options[0].textContent = (dict.tutorials.onoff && dict.tutorials.onoff.panelTitle) || "Power on and off";
            howtoSelector.options[1].textContent = (dict.tutorials.charging && dict.tutorials.charging.panelTitle) || "Charging";
            howtoSelector.options[2].textContent = (dict.tutorials.nav && dict.tutorials.nav.panelTitle) || "Navigation";
          }
          navMap.setAttribute("aria-label", tutorial.miniNavLabel);
          device.setAttribute("aria-label", tutorial.panelTitle);
          gestureIntroText.textContent = tutorial.touchHint;
          document.getElementById("nav-mystery-title").textContent = steps[0].short;
          document.getElementById("nav-mysteries-title").textContent = steps[1].short;
          document.getElementById("nav-intention-title").textContent = steps[3].short;
          document.getElementById("nav-intentions-title").textContent = steps[4].short;
          document.getElementById("nav-intention-body").textContent = tutorial.intentionPlaceholder;
          document.getElementById("nav-intention-subtitle").textContent = tutorial.intentionSubtitle;
          document.getElementById("nav-intentions-item1").textContent = tutorial.intentionItems[0];
          document.getElementById("nav-intentions-item2").textContent = tutorial.intentionItems[1];
          document.getElementById("nav-intentions-item3").textContent = tutorial.intentionItems[2];
          document.getElementById("nav-settings-title").textContent = getLangText("l005", "Settings");
          document.getElementById("nav-settings-option-selected").textContent = getLangText("l006", "Start the rosary\nwith the selected Mystery");
          document.getElementById("nav-settings-option-last").textContent = getLangText("l007", "Start the rosary\nwith the last state");
          document.getElementById("nav-settings2-title").textContent = getLangText("l005", "Settings");
          document.getElementById("nav-settings2-option-haptic").textContent = getLangText("l009", "Haptic feedback\n(vibration)");
          document.getElementById("nav-settings3-title").textContent = getLangText("l005", "Settings");
          document.getElementById("nav-settings3-option-brightness").textContent = getLangText("l010", "Screen brightness");
          document.getElementById("nav-settings4-title").textContent = getLangText("l005", "Settings");
          document.getElementById("nav-settings4-option-wallpaper").textContent = getLangText("l011", "Wallpaper brightness");
          document.getElementById("nav-settings5-title").textContent = getLangText("l005", "Settings");
          document.getElementById("nav-settings5-option-orientation").textContent = getLangText("l012", "Screen orientation");
          document.getElementById("nav-settings6-title").textContent = getLangText("l005", "Settings");
          document.getElementById("nav-settings6-option-shutdown").textContent = getLangText("l021", "Auto shutdown\nafter inactivity");
          document.getElementById("nav-settings6-never").textContent = getLangText("l022", "Never");
          document.getElementById("nav-settings7-more").textContent = `v1.28 · ${language} v1.0`;
          document.getElementById("nav-settings7-qr").setAttribute("aria-label", tutorial.deviceInfo.qrLabel);
          renderMysteriesRoller();
          renderStatsPanels();
        }

        function positionPanels(view) {
          const currentPosition = screenPositions[view];

          panels.forEach((screenPanel) => {
            const panelPosition = screenPositions[screenPanel.dataset.screen];
            const offsetX = panelPosition.x - currentPosition.x;
            const offsetY = panelPosition.y - currentPosition.y;
            const isActive = screenPanel.dataset.screen === view;

            screenPanel.style.transform = `translate3d(${offsetX * 100}%, ${offsetY * 100}%, 0)`;
            screenPanel.classList.toggle("screen-panel--active", isActive);
            screenPanel.setAttribute("aria-hidden", String(!isActive));
          });
        }

        function updateDirectionalArrows() {
          const upTarget = navigationMap[currentView]?.up;
          const downTarget = navigationMap[currentView]?.down;
          const leftTarget = navigationMap[currentView]?.left;
          const rightTarget = navigationMap[currentView]?.right;

          deviceUp.disabled = !upTarget;
          deviceDown.disabled = !downTarget;
          deviceLeft.disabled = !leftTarget;
          deviceRight.disabled = !rightTarget;
          deviceUp.setAttribute("aria-label", upTarget ? getCopyForKey(upTarget).title : tutorial.wallpaper.title);
          deviceDown.setAttribute("aria-label", downTarget ? getCopyForKey(downTarget).title : tutorial.settings.title);
          deviceLeft.setAttribute("aria-label", leftTarget ? getCopyForKey(leftTarget).title : common.previous);
          deviceRight.setAttribute("aria-label", rightTarget ? getCopyForKey(rightTarget).title : common.next);
        }

        function dismissGestureIntro() {
          if (!gestureIntroVisible) return;
          gestureIntroVisible = false;
          gestureIntro.classList.add("gesture-intro--hidden");
        }

        function renderView(view, { animate = true, revealWallpaper = true } = {}) {
          if (!screenPositions[view]) return;

          if (wallpaperTimer) {
            window.clearTimeout(wallpaperTimer);
            wallpaperTimer = null;
          }

          if (view === currentView) {
            activeMapKey = view;
            if (view === "rosary" && revealWallpaper) screenBg.style.opacity = "0.6";
            renderDescription(view);
            updateDirectionalArrows();
            return;
          }

          screenBg.style.opacity = "0";
          currentView = view;
          activeMapKey = view;
          stage.dataset.view = view;
          positionPanels(view);

          [...horizontalViews, ...statsViews, "settings1", "settings2", "settings3", "settings4", "settings5", "settings6", "settings7"].forEach((name) => {
            device.classList.toggle(`device--${name}`, name === view);
          });
          device.classList.toggle("device--stats", view.startsWith("stats-"));
          device.classList.toggle("device--settings", view.startsWith("settings"));

          if (view === "rosary" && revealWallpaper) {
            if (animate) {
              wallpaperTimer = window.setTimeout(() => {
                screenBg.style.opacity = "0.6";
                wallpaperTimer = null;
              }, 280);
            } else {
              screenBg.style.opacity = "0.6";
            }
          }

          renderDescription(view);
          updateDirectionalArrows();
        }

        function cycleWallpaper() {
          const changeDelay = currentView === "rosary" ? 160 : 280;

          if (currentView !== "rosary") {
            renderView("rosary", { revealWallpaper: false });
          }

          activeMapKey = "wallpaper";
          screenBg.style.opacity = "0";
          renderDescription("wallpaper");
          if (wallpaperTimer) window.clearTimeout(wallpaperTimer);
          wallpaperTimer = window.setTimeout(() => {
            wallpaperIndex = (wallpaperIndex + 1) % wallpapers.length;
            screenBg.style.backgroundImage = `url("../bg/${wallpapers[wallpaperIndex]}.png")`;
            screenBg.style.opacity = "0.6";
            wallpaperTimer = null;
          }, changeDelay);
        }

        function activateMapItem(key) {
          dismissGestureIntro();
          if (key === "wallpaper") cycleWallpaper();
          else renderView(key);
        }

        function navigateBySwipe(direction) {
          const target = navigationMap[currentView]?.[direction];

          if (!target) return;
          dismissGestureIntro();
          activateMapItem(target);
        }

        function selectLanguage(requestedLanguage) {
          const copy = window.SmartRosaryHowtoI18n.getTutorial("nav", requestedLanguage);

          common = copy.common;
          tutorial = copy.tutorial;
          language = copy.language;
          steps = tutorial.steps;

          const url = new URL(window.location.href);
          url.searchParams.set("lang", language);
          try {
            window.history.replaceState(null, "", url);
          } catch {
            // Some browsers restrict History API updates for local file URLs.
          }
          applyCopy();
          renderDescription(activeMapKey);
          updateDirectionalArrows();
        }

        const howtoSelector = document.getElementById("howto-selector");
        if (howtoSelector) {
          howtoSelector.value = "020_nav.html";
          howtoSelector.addEventListener("change", () => {
            const url = new URL(howtoSelector.value, window.location.href);
            url.searchParams.set("lang", language);
            window.location.href = url.href;
          });
        }
        languageSelect.addEventListener("change", () => selectLanguage(languageSelect.value));
        deviceUp.addEventListener("click", () => navigateBySwipe("up"));
        deviceDown.addEventListener("click", () => navigateBySwipe("down"));
        deviceLeft.addEventListener("click", () => navigateBySwipe("left"));
        deviceRight.addEventListener("click", () => navigateBySwipe("right"));
        screen.addEventListener("pointerdown", (event) => {
          if (event.pointerType === "mouse" && event.button !== 0) return;
          pointerStart = { x: event.clientX, y: event.clientY, pointerId: event.pointerId };
          screen.setPointerCapture?.(event.pointerId);
        });
        screen.addEventListener("pointerup", (event) => {
          if (!pointerStart || pointerStart.pointerId !== event.pointerId) return;

          const deltaX = event.clientX - pointerStart.x;
          const deltaY = event.clientY - pointerStart.y;
          pointerStart = null;
          if (Math.max(Math.abs(deltaX), Math.abs(deltaY)) < 32) return;

          if (Math.abs(deltaX) > Math.abs(deltaY)) navigateBySwipe(deltaX < 0 ? "right" : "left");
          else navigateBySwipe(deltaY < 0 ? "down" : "up");
        });
        screen.addEventListener("pointercancel", () => {
          pointerStart = null;
        });

        buildBeads();
        renderSettingsQr();
        updateClock();
        window.setInterval(updateClock, 1000);
        applyCopy();
        renderView("rosary", { animate: false });
        window.requestAnimationFrame(() => device.classList.add("nav-device--ready"));
      })();
    </script>
    <script src="deploy-footer.js"></script>
